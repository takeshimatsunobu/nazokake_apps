# cloudbuild.yaml
# ================
# 手動デプロイ用のビルド定義。apps/evaluator/Dockerfile を明示的に指定することで、
# .github/workflows/deploy_cloud_run.yml (CI/CD) と全く同じビルド経路に固定する。
#
# 【背景・フェーズ1で判明した根本原因】素の `gcloud run deploy --source .` は、
# ソースディレクトリの「直下」に Dockerfile が無いとCloud Native Buildpacksへ
# フォールバックする。本リポジトリの Dockerfile は apps/evaluator/Dockerfile
# という非標準の場所にあり、リポジトリルートには Dockerfile も requirements.txt
# も存在しないため、フラグ無しの `gcloud run deploy --source .` はビルドパック検出に
# 失敗するか、ルート直下の Procfile 経由で全く別物をビルドしていた(過去のCloud
# Buildログを実際に調査し、"verify-scratch"タグの手動ビルドは常に
# `--dockerfile apps/evaluator/Dockerfile` 相当の明示指定があったことで初めて
# 成功していたと確認済み)。
#
# 本ファイルはCloud Build自体にビルド手順を焼き込むことで、"フラグを覚えている
# 人だけが正しくビルドできる"状態を解消する。
#
# 使い方(ビルド+Artifact Registryへのpushのみ。Cloud Runへの反映は含まない):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_TAG=manual-$(date +%Y%m%d-%H%M%S)
#
# ビルドしたイメージを実際にCloud Runへ反映する手順は、ビルドとデプロイを1つの
# 設定ファイルへ暗黙的に混ぜず、人間が明示的に確認してから実行できるよう、
# 意図的に別コマンドに分離している(下記「デプロイ手順」を参照)。

substitutions:
  # 未指定時のデフォルト。CI/CD(.github/workflows/deploy_cloud_run.yml)は
  # ${{ github.sha }} を使うため、手動ビルドと衝突しないよう "manual-" を前置する。
  _TAG: "manual-latest"

steps:
  - name: gcr.io/cloud-builders/docker
    # 【実機で確認した障害】gcr.io/cloud-builders/docker が内蔵するdocker CLIは
    # 既定でクラシックビルダーのままであり、apps/evaluator/Dockerfileの
    # `COPY --exclude=...`(BuildKit専用構文)を "Unknown flag: exclude" として
    # 拒否する。DOCKER_BUILDKIT=1でBuildKitを明示的に有効化すると、Dockerfile
    # 冒頭の `# syntax=docker/dockerfile:1` プラグマによりBuildKitが最新の公式
    # frontendを動的取得するため、ローカルのdocker CLI自体の新旧に関わらず
    # `--exclude` を正しく解釈できる。
    #
    # Dockerfile側の`--exclude`(serviceAccountKey.json/.env等の機密ファイルを
    # イメージ層から二重に除外する多層防御。.gcloudignore/.dockerignoreと役割が
    # 異なる)は意図的に維持し、こちら側をビルド環境に合わせて修正する。
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - build
      - -f
      - apps/evaluator/Dockerfile
      - -t
      - asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-backend:${_TAG}
      - .

images:
  - asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-backend:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
