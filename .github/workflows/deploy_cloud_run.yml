# .github/workflows/deploy_cloud_run.yml
# ============================================
# GitリポジトリをSSoTとしたPull型デプロイパイプライン(instructions/004)。
# SSoT_architecture.md 9節が定義する「コードは一方向(Local -> Cloud、プル型デプロイ)」
# を、GitHub Actions + Workload Identity Federation (WIF) で実装する。
#
# サービスアカウントキーJSON(長期認証情報)は一切使用しない。GitHub Actionsが
# 発行するOIDCトークンをWIF経由でGCPサービスアカウントへ交換し、短命な認証情報のみで
# デプロイする(google-github-actions/authのWIF利用パターン)。
#
# 事前準備(WIF Pool/Provider・CI/CD用サービスアカウント・Artifact Registry・
# Container Analysis APIの有効化)は、人間のオペレーターが
# infra/scripts/setup_gcp_wif_and_secrets.sh(instructions/218)を一度だけ実行して
# 完了させる。設計・IAMロールの根拠は infra/docs/gcp_wif_artifact_registry_setup.md
# を参照。PROJECT_ID/REGION/REPOSITORY/SERVICE_NAMEはcloudbuild.yaml(リポジトリ
# ルート)の既存値と一致させてあり、切替時の値の不整合は無い。
#
# 【解消済みの制約(記録として残す)】このワークフロー実装当初、`apps/evaluator/`が
# ルート.gitignoreで除外されており、actions/checkoutでは`apps/evaluator/Dockerfile`
# がチェックアウトされずビルドに失敗する制約があった。commit 39de1ef
# (「physically integrate apps/evaluator into monorepo」)によりapps/evaluator/は
# このスーパープロジェクトのgit管理下へ物理統合済みであり、`git ls-files
# apps/evaluator/Dockerfile`で追跡対象であることを確認済み(instructions/218)。
# この制約は解消されているが、実際にこのワークフローがpush-to-deployまで通ることは
# GCP/GitHub側のWIF設定が確定するまでこの開発機では動的に検証できていない
# (docs/DEPLOYMENT.md 7節参照)。

name: Deploy to Cloud Run (WIF)

on:
  push:
    branches: [main]
    paths:
      # infra/ や tools/ の変更ではクラウドへのデプロイを実行しない(instructions/004)。
      - "apps/**"
      # instructions/222: パイプライン自体(このファイル)を修正した際にも
      # 自動でE2E検証が走るようにする。
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: nazokakeapp-137e5
  REGION: asia-northeast1
  REPOSITORY: nazo-agent
  SERVICE_NAME: nazokake-backend
  DOCKERFILE_PATH: apps/evaluator/Dockerfile
  IMAGE: asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # サービスアカウントキーJSONは使用しない。WIF経由でOIDCトークンを
      # 短命なGCPアクセストークンへ交換する。
      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            -f "${{ env.DOCKERFILE_PATH }}" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            .

      - name: Push image to Artifact Registry
        run: docker push "${{ env.IMAGE }}:${{ github.sha }}"

      # Container Analysis (On-Demand Scanning API) によるCRITICAL/HIGH脆弱性の
      # ハード・フェイルゲート(instructions/005でプレースホルダーから本実装へ格上げ)。
      # instructions/220-221での初回E2E実行で判明: `gcloud artifacts docker images
      # scan --location` はArtifact Registryのリージョン(asia-northeast1)ではなく、
      # Container Analysisのマルチリージョン(asia/europe/us)のみを受け付ける。
      - name: Scan image for CRITICAL/HIGH vulnerabilities (hard-fail gate)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.IMAGE }}:${{ github.sha }}"

          SCAN_NAME=$(gcloud artifacts docker images scan "${IMAGE_REF}" \
            --location="asia" \
            --format='value(response.scan)')
          echo "scan resource: ${SCAN_NAME}"

          SEVERE_COUNT=$(gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
            --format='value(vulnerability.effectiveSeverity)' \
            | grep -E '^(CRITICAL|HIGH)$' | wc -l || true)
          echo "CRITICAL/HIGH件数: ${SEVERE_COUNT}"

          if [ "${SEVERE_COUNT}" -gt 0 ]; then
            echo "🚨 CRITICAL/HIGHの重大な脆弱性が${SEVERE_COUNT}件検出されたため、デプロイをハード・フェイルさせます。" >&2
            gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
              --format='table(vulnerability.effectiveSeverity, vulnerability.cvssScore, noteName)' >&2 || true
            exit 1
          fi

          echo "✅ CRITICAL/HIGHの脆弱性は検出されませんでした(MEDIUM以下、または無し)。デプロイを継続します。"
          exit 0

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
