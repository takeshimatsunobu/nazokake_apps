# .github/workflows/deploy_cloud_run.yml
# ============================================
# GitリポジトリをSSoTとしたPull型デプロイパイプライン(instructions/004)。
# SSoT_architecture.md 9節が定義する「コードは一方向(Local -> Cloud、プル型デプロイ)」
# を、GitHub Actions + Workload Identity Federation (WIF) で実装する。
#
# サービスアカウントキーJSON(長期認証情報)は一切使用しない。GitHub Actionsが
# 発行するOIDCトークンをWIF経由でGCPサービスアカウントへ交換し、短命な認証情報のみで
# デプロイする(google-github-actions/authのWIF利用パターン)。
#
# 事前準備(WIF Pool/Provider・CI/CD用サービスアカウント・Artifact Registry・
# Container Analysis APIの有効化)は、人間のオペレーターが
# infra/scripts/setup_gcp_wif_and_secrets.sh(instructions/218)を一度だけ実行して
# 完了させる。設計・IAMロールの根拠は infra/docs/gcp_wif_artifact_registry_setup.md
# を参照。PROJECT_ID/REGION/REPOSITORY/SERVICE_NAMEはcloudbuild.yaml(リポジトリ
# ルート)の既存値と一致させてあり、切替時の値の不整合は無い。
#
# 【解消済みの制約(記録として残す)】このワークフロー実装当初、`apps/evaluator/`が
# ルート.gitignoreで除外されており、actions/checkoutでは`apps/evaluator/Dockerfile`
# がチェックアウトされずビルドに失敗する制約があった。commit 39de1ef
# (「physically integrate apps/evaluator into monorepo」)によりapps/evaluator/は
# このスーパープロジェクトのgit管理下へ物理統合済みであり、`git ls-files
# apps/evaluator/Dockerfile`で追跡対象であることを確認済み(instructions/218)。
# この制約は解消されているが、実際にこのワークフローがpush-to-deployまで通ることは
# GCP/GitHub側のWIF設定が確定するまでこの開発機では動的に検証できていない
# (docs/DEPLOYMENT.md 7節参照)。

name: Deploy to Cloud Run (WIF)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # infra/ や tools/ の変更ではクラウドへのデプロイを実行しない(instructions/004)。
      - "apps/**"
      # Phase5.5: packages/shared_core(nazokake_core)はapps/evaluator/backend・
      # apps/persona_main_function双方のDockerビルドがCOPYで取り込む実行時依存であり、
      # このパスだけを変更してもapps/**に触れないため従来はCDが起動しなかった
      # (実機で本番の記憶喪失バグ修正が自動デプロイされず、workflow_dispatchでの
      # 手動救済を要した障害を受けて追加)。
      - "packages/shared_core/**"
      # instructions/222: パイプライン自体(このファイル)を修正した際にも
      # 自動でE2E検証が走るようにする。
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: nazokakeapp-137e5
  REGION: asia-northeast1
  REPOSITORY: nazo-agent
  # 【service名の統合】従来はnazokake-backendへ自動デプロイしていたが、手動検証中に
  # 別名(nazokake-api)のCloud Runサービスを作成してそちらを正式運用に切り替えた
  # ため、CI/CDの向き先もそれに追従させる。IMAGE(Artifact Registry上のイメージ名)は
  # Cloud RunのSERVICE_NAMEとは独立した別概念のため意図的に変更しない
  # (nazokake-apiサービスも同じ"nazokake-backend"イメージ名のまま運用する)。
  SERVICE_NAME: nazokake-api
  DOCKERFILE_PATH: apps/evaluator/Dockerfile
  IMAGE: asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # サービスアカウントキーJSONは使用しない。WIF経由でOIDCトークンを
      # 短命なGCPアクセストークンへ交換する。
      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            -f "${{ env.DOCKERFILE_PATH }}" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            .

      - name: Push image to Artifact Registry
        run: docker push "${{ env.IMAGE }}:${{ github.sha }}"

      # Container Analysis (On-Demand Scanning API) によるCRITICAL/HIGH脆弱性の
      # ハード・フェイルゲート(instructions/005でプレースホルダーから本実装へ格上げ)。
      # instructions/220-221での初回E2E実行で判明: `gcloud artifacts docker images
      # scan --location` はArtifact Registryのリージョン(asia-northeast1)ではなく、
      # Container Analysisのマルチリージョン(asia/europe/us)のみを受け付ける。
      # instructions/222での2回目のE2E実行で判明: 初回のscan実行時、
      # `local-extract`コンポーネントの追加インストール確認プロンプトが出るが、
      # GitHub Actionsの非対話セッションでは応答できずエラーになるため --quiet が必要。
      - name: Scan image for CRITICAL/HIGH vulnerabilities (hard-fail gate)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.IMAGE }}:${{ github.sha }}"

          SCAN_NAME=$(gcloud artifacts docker images scan "${IMAGE_REF}" \
            --location="asia" \
            --quiet \
            --format='value(response.scan)')
          echo "scan resource: ${SCAN_NAME}"

          SEVERE_COUNT=$(gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
            --format='value(vulnerability.effectiveSeverity)' \
            | grep -E '^(CRITICAL|HIGH)$' | wc -l || true)
          echo "CRITICAL/HIGH件数: ${SEVERE_COUNT}"

          if [ "${SEVERE_COUNT}" -gt 0 ]; then
            echo "🚨 CRITICAL/HIGHの重大な脆弱性が${SEVERE_COUNT}件検出されたため、デプロイをハード・フェイルさせます。" >&2
            gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
              --format='table(vulnerability.effectiveSeverity, vulnerability.cvssScore, noteName)' >&2 || true
            exit 1
          fi

          echo "✅ CRITICAL/HIGHの脆弱性は検出されませんでした(MEDIUM以下、または無し)。デプロイを継続します。"
          exit 0

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # CPUを常に割り当てる(CPU always allocated)。BackgroundTasksでの生成処理
          # (Gemini API呼び出し)が、レスポンス返却直後のCPUスロットリングで途中停止
          # しないようにするための設定。既定(リクエスト処理中のみCPU割当)のままだと、
          # HTTPレスポンス送出後にCPUが絞られ、バックグラウンドの非同期処理が
          # 完走できない場合がある。
          flags: --no-cpu-throttling
          # instructions/248: `gcloud run deploy` はインクリメンタルであり、ここを
          # 省略しても既存のシークレット/環境変数バインドを消しはしない(実際、この
          # ワークフローが去年から本番へデプロイし続けている現行リビジョンにも
          # GEMINI_API_KEY/ANTHROPIC_API_KEYは正しくバインドされたままだった)。
          # ただし暗黙の継承に頼ると、このサービスをゼロから再作成する場合や、
          # 手順書(infra/scripts/setup_gcp_wif_and_secrets.sh)の一度きりの手動設定を
          # 誰も覚えていない場合に静かに壊れる。cloudbuild.yaml(このリポジトリの
          # もう一方のデプロイ経路)に既に定義済みの値をそのままSSoTとして踏襲し、
          # このワークフロー単体でも同じ状態を再現できるように明示する。
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
          # 【Phase5.5緊急対応】OWNER_EMAIL(api/deps.py::verify_admin_token()の
          # 管理者ブートストラップ用、admin_usersに誰も居ない状態を解消する唯一の
          # 抜け道)は個人のメールアドレス(PII)のため、リポジトリへ平文コミットせず
          # GitHub Secretsから注入する(リポジトリ設定 Settings > Secrets and
          # variables > Actions で OWNER_EMAIL という名前のSecretを事前に登録して
          # おくこと。未設定の場合は空文字列となりブートストラップが機能しない
          # だけで、既存の管理者アクセスには影響しない)。
          env_vars: |
            EXCHANGE_RATE_USD_JPY=160.0
            SERVER_COST_PER_HOUR_JPY=5.0
            OWNER_EMAIL=${{ secrets.OWNER_EMAIL }}

      # 【instructions/291】instructions/290で確定した「片肺デプロイ」(バックエンドの
      # みが自動デプロイされ、Firebase Hostingへのフロントエンド配信が
      # instructions/272の対応で誤って断絶していた)の復旧。バックエンドのデプロイが
      # 成功した後にのみ実行することで、フロントエンド(API_BASE等)とバックエンドの
      # 契約が食い違った状態が本番に公開される窓を作らない。
      - name: Setup Node.js (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # firebase-tools は GOOGLE_APPLICATION_CREDENTIALS (google-github-actions/auth
      # が上のauthステップで既にエクスポート済み)を自動的に検出して認証するため、
      # firebase login:ci のトークンやサービスアカウントキーの追加設定は不要
      # (実際にこのステップが本番へデプロイまで通ることは、Firebase Hosting用の
      # IAMロールがWIFサービスアカウントに付与済みであるかにも依存するため、
      # この開発機では動的に検証できていない。deploy_cloud_run.yml冒頭の既存の
      # 注記と同じ制約)。firebase.json/.firebaserc は apps/evaluator 配下にあり、
      # hosting.public が frontend/public を指すため、そのディレクトリを
      # working-directory とする。
      - name: Deploy frontend to Firebase Hosting
        working-directory: apps/evaluator
        run: firebase deploy --only hosting --project "${{ env.PROJECT_ID }}" --non-interactive
