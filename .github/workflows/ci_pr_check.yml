# .github/workflows/ci_pr_check.yml
# ============================================
# instructions/223-224: シフトレフトCI。
# 現行のdeploy_cloud_run.yml(push to main後にスキャン)では、脆弱性の発覚が
# main マージ後 = Artifact Registryに既にイメージが存在した後になってしまう
# (instructions/220-222の初回E2E検証で11件のCRITICAL/HIGH脆弱性がこの形で発覚)。
# このワークフローはPRのビルド&スキャンをマージ「前」に実行し、一時タグ
# (pr-<PR番号>)でArtifact Registryへ試験的にPushしてスキャンすることで、
# 危険なイメージがmainへ辿り着く前にPR上で機械的にブロックする。
#
# deploy_cloud_run.ymlとスキャンのロジックが重複しているのは既知のトレードオフ。
# 両ワークフローをworkflow_callで共通化するのは、今回の変更のスコープを
# 最小限に保つため、動作確認後の別PRでのフォローアップとする。

name: CI - PR Build & Vulnerability Scan (Shift-Left)

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/**"
      # 【instructions/293】このワークフロー自体はpyrightconfig.jsonの内容を一切
      # 参照しない(Dockerビルド+脆弱性スキャン専用)が、もしこのジョブがGitHubの
      # Required Status Checksに設定されている場合、パスフィルタで発火しない
      # PR(pyrightconfig.jsonのみの変更等)はチェックが永久に「待機中」のまま
      # マージをブロックし得る。この環境からはリポジトリのブランチ保護設定
      # (どのチェックがRequiredか)を直接確認できなかったため、実害の有無に
      # 関わらず予防的に追加する(コストは低頻度の余分なDockerビルドのみ)。
      - "pyrightconfig.json"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: nazokakeapp-137e5
  REGION: asia-northeast1
  REPOSITORY: nazo-agent
  DOCKERFILE_PATH: apps/evaluator/Dockerfile
  IMAGE: asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-backend

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image (PR temp tag)
        run: |
          docker build \
            -f "${{ env.DOCKERFILE_PATH }}" \
            -t "${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}" \
            .

      - name: Push image to Artifact Registry (temp tag)
        run: docker push "${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}"

      # deploy_cloud_run.ymlと同一ロジック(instructions/220-222で判明した
      # --location/--quietの制約を含む)。ここで検出された場合、PRのステータス
      # チェックが失敗し、マージ前にブロックされる。
      - name: Scan image for CRITICAL/HIGH vulnerabilities (hard-fail gate)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}"

          SCAN_NAME=$(gcloud artifacts docker images scan "${IMAGE_REF}" \
            --location="asia" \
            --quiet \
            --format='value(response.scan)')
          echo "scan resource: ${SCAN_NAME}"

          SEVERE_COUNT=$(gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
            --format='value(vulnerability.effectiveSeverity)' \
            | grep -E '^(CRITICAL|HIGH)$' | wc -l || true)
          echo "CRITICAL/HIGH件数: ${SEVERE_COUNT}"

          if [ "${SEVERE_COUNT}" -gt 0 ]; then
            echo "🚨 CRITICAL/HIGHの重大な脆弱性が${SEVERE_COUNT}件検出されたため、CIをハード・フェイルさせます。" >&2
            gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
              --format='table(vulnerability.effectiveSeverity, vulnerability.cvssScore, vulnerability.packageIssue[0].affectedPackage, noteName)' >&2 || true
            exit 1
          fi

          echo "✅ CRITICAL/HIGHの脆弱性は検出されませんでした(MEDIUM以下、または無し)。マージ可能です。"
          exit 0

      # PR用の一時イメージはマージ判断にのみ使うため、Artifact Registryに
      # 残さない(成功/失敗どちらの場合も掃除する)。
      - name: Clean up temporary PR image
        if: always()
        run: |
          gcloud artifacts docker images delete \
            "${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}" \
            --quiet || true
