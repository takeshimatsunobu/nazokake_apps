# .github/workflows/deploy_persona_router.yml
# ============================================
# apps/persona_router 用のGitOpsデプロイパイプライン。deploy_cloud_run.yml
# (apps/evaluator用)と同一の設計方針(WIF、脆弱性スキャンのハード・フェイルゲート、
# 後段でのFirebase Hostingデプロイ)を踏襲する。cloudbuild.persona-router.yaml
# (ビルド+Artifact Registryへのpushのみ、手動運用向け)の内容をベースに、
# ビルド〜Cloud Runへの反映〜フロントエンド配信までを自動化する。
#
# 【なぜビルドコンテキストがリポジトリルートか】apps/persona_router/Dockerfile自身の
# ヘッダーコメントの通り、`gcloud run deploy --source apps/persona_router`のような
# ディレクトリ単体をビルドコンテキストにする手段は使えない([tool.uv.sources]の
# nazokake-core = { path = "../../packages/shared_core" }を解決できずビルド失敗する)。
# deploy_cloud_run.ymlと同じく、リポジトリルートをビルドコンテキストとして明示する。
#
# 【CPUスロットリングについて】apps/evaluator用ワークフローはBackgroundTasks
# (レスポンス送出後も継続する非同期生成処理)のために--no-cpu-throttlingを付与
# しているが、persona_routerのPOST /v1/generateはリクエスト処理内で完結する同期
# 処理(services/step2_generation.pyのdocstring参照)であり、レスポンス送出後に
# 継続するバックグラウンド処理を持たないため、この設定は不要(現行の手動デプロイ
# 済みリビジョンも既定のCPUスロットリングのままであることを実機で確認済み)。

name: Deploy persona_router to Cloud Run (WIF)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/persona_router/**"
      # packages/shared_core(nazokake_core)はDockerビルドがCOPYで取り込む実行時
      # 依存(uv.lockの[tool.uv.sources]参照)であり、この変更だけでも再デプロイが
      # 必要になる。deploy_cloud_run.ymlで実際にこのパスの欠落によりCDが起動せず
      # 手動workflow_dispatchでの救済を要した実機障害を踏まえ、最初からパスに含める。
      - "packages/shared_core/**"
      - ".github/workflows/deploy_persona_router.yml"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: nazokakeapp-137e5
  REGION: asia-northeast1
  REPOSITORY: nazo-agent
  SERVICE_NAME: nazokake-persona-router
  DOCKERFILE_PATH: apps/persona_router/Dockerfile
  IMAGE: asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-persona-router

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # サービスアカウントキーJSONは使用しない。GitHub Actionsが発行するOIDC
      # トークンをWIF経由でGCPアクセストークンへ交換する(deploy_cloud_run.ymlと
      # 同一のWIFプール/プロバイダ/サービスアカウントを再利用する)。
      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            -f "${{ env.DOCKERFILE_PATH }}" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            .

      - name: Push image to Artifact Registry
        run: docker push "${{ env.IMAGE }}:${{ github.sha }}"

      # deploy_cloud_run.ymlと同一の脆弱性ハード・フェイルゲート(CRITICAL/HIGH検出時は
      # デプロイ自体を止める)。
      - name: Scan image for CRITICAL/HIGH vulnerabilities (hard-fail gate)
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.IMAGE }}:${{ github.sha }}"

          SCAN_NAME=$(gcloud artifacts docker images scan "${IMAGE_REF}" \
            --location="asia" \
            --quiet \
            --format='value(response.scan)')
          echo "scan resource: ${SCAN_NAME}"

          SEVERE_COUNT=$(gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
            --format='value(vulnerability.effectiveSeverity)' \
            | grep -E '^(CRITICAL|HIGH)$' | wc -l || true)
          echo "CRITICAL/HIGH件数: ${SEVERE_COUNT}"

          if [ "${SEVERE_COUNT}" -gt 0 ]; then
            echo "🚨 CRITICAL/HIGHの重大な脆弱性が${SEVERE_COUNT}件検出されたため、デプロイをハード・フェイルさせます。" >&2
            gcloud artifacts docker images list-vulnerabilities "${SCAN_NAME}" \
              --format='table(vulnerability.effectiveSeverity, vulnerability.cvssScore, noteName)' >&2 || true
            exit 1
          fi

          echo "✅ CRITICAL/HIGHの脆弱性は検出されませんでした(MEDIUM以下、または無し)。デプロイを継続します。"
          exit 0

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # 現行の手動デプロイ済みリビジョンと同じ構成(GEMINI_API_KEYシークレット、
          # GCP_PROJECT_ID環境変数)をSSoTとしてそのまま踏襲する。
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
          env_vars: |
            GCP_PROJECT_ID=nazokakeapp-137e5

      # 【instructions/291と同じ理由】バックエンドのデプロイ成功後にのみフロントエンドを
      # デプロイすることで、フロントエンドとバックエンドの契約が食い違った状態が
      # 本番に公開される窓を作らない。
      - name: Setup Node.js (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # apps/persona_router/firebase.json は名前付きターゲット("persona-router")を
      # 使用しており、apps/persona_router/.firebaserc に .firebaserc/firebase.json
      # 双方がそろっているため working-directory をこのディレクトリに固定するだけで
      # 自己完結する(deploy_cloud_run.ymlのapps/evaluator側と同じパターン)。
      - name: Deploy frontend to Firebase Hosting
        working-directory: apps/persona_router
        run: firebase deploy --only hosting:persona-router --project "${{ env.PROJECT_ID }}" --non-interactive
