<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【管理画面】なぞかけディスカバリー</title>
    <style>
        :root { --bg-dark: #121212; --panel-bg: #1e1e1e; --text-main: #e0e0e0; --accent: #ff4500; --golden: #daa520; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; }
        header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--text-main); }
        .danger-text { color: var(--accent); font-weight: bold; background: rgba(255,69,0,0.1); padding: 5px 10px; border-radius: 4px; }
        .admin-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        
        .item-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #2a2a2a; margin-bottom: 15px; padding: 20px; border-radius: 6px; border-left: 5px solid #555; }
        .item-row.is-golden { border-left-color: var(--golden); background: #2d2a1f; }
        
        .item-info { flex: 1; min-width: 300px; }
        .item-odai { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .item-text { font-size: 1.05rem; color: #ccc; margin-bottom: 12px; line-height: 1.5; }
        .item-meta { font-size: 0.9rem; color: #aaa; }
        .score-box { display: inline-block; background: #000; padding: 2px 8px; border-radius: 4px; margin-right: 10px; color: #4CAF50; font-weight: bold;}
        
        .item-actions { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 15px; font-size: 0.95rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-golden { background-color: var(--golden); color: #000; }
        .btn-golden:hover { filter: brightness(1.2); }
        .btn-delete { background-color: #8b0000; color: #fff; }
        .btn-delete:hover { background-color: #ff0000; }
        .home-link { color: #888; text-decoration: none; font-size: 1rem; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; }
        .home-link:hover { background: #333; color: #fff; }
    </style>
</head>
<body>

<header>
    <h1>🛠️ RLHF データセット管理コックピット</h1>
    <div>
        <span class="danger-text">※取扱注意：ここでの操作はDBから完全にデータを消し去ります。</span>
        <a href="/" class="home-link">🏠 一般画面へ戻る</a>
    </div>
</header>

<div class="admin-panel">
    <h2>データベース一覧</h2>
    <div id="admin-list">データを読み込んでいます...</div>
</div>

<script>
    window.onload = loadAdminFeed;

    async function loadAdminFeed() {
        try {
            const res = await fetch('https://nazokake-backend-862686676938.asia-northeast1.run.app`https://nazokake-backend-862686676938.asia-northeast1.run.app/api/feed');
            const data = await res.json();
            
            // 殿堂入りを上に、その後にトレンドと発掘待ちを連結
            const allItems = [...data.golden, ...data.top10, ...data.random];
            renderAdminList(allItems);
        } catch (e) {
            console.error(e);
            document.getElementById('admin-list').innerText = "通信エラーが発生しました。";
        }
    }

    function renderAdminList(items) {
        const container = document.getElementById('admin-list');
        container.innerHTML = '';
        
        if(!items || items.length === 0) {
            container.innerHTML = '<p>データがありません。</p>';
            return;
        }

        items.forEach(item => {
            const row = document.createElement('div');
            row.className = `item-row ${item.is_golden ? 'is-golden' : ''}`;
            
            const status = item.is_golden ? '👑 殿堂入り' : '一般データ';
            const evalCount = item.user_evaluations ? item.user_evaluations.length : 0;
            
            // 偏差スコアの計算（存在する場合）
            let devScore = item.weekly_score ? `<span class="score-box">📈 偏差: ${item.weekly_score}</span>` : '';

            row.innerHTML = `
                <div class="item-info">
                    <div class="item-odai">【お題】${item.A_TITLE || '不明'}</div>
                    <div class="item-text">${item.nazokake_text}</div>
                    <div class="item-meta">
                        ${devScore}ステータス: ${status} | 人間からの評価: ${evalCount}件 | 作者: ${item.author || 'AI'}
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-golden" onclick="toggleGolden('${item.doc_id}', ${item.is_golden})">
                        ${item.is_golden ? '殿堂入り解除' : '👑 殿堂入りに昇格'}
                    </button>
                    <button class="btn-delete" onclick="deleteItem('${item.doc_id}')">🗑️ 削除 (破棄)</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    // 🔥 バックエンドのAPIを実際に叩く処理
    async function toggleGolden(docId, currentStatus) {
        const action = currentStatus ? "「解除」" : "「殿堂入り」";
        if(!confirm(`この作品を${action}しますか？\n（殿堂入りした作品はAIの学習手本として使われます）`)) return;
        
        try {
            const res = await fetch('https://nazokake-backend-862686676938.asia-northeast1.run.app`https://nazokake-backend-862686676938.asia-northeast1.run.app/api/admin/toggle_golden', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ doc_id: docId, is_golden: currentStatus })
            });
            if(res.ok) loadAdminFeed(); // 成功したらリストを再読み込み
            else alert('エラーが発生しました。');
        } catch(e) { alert('通信エラーです。'); }
    }

    async function deleteItem(docId) {
        if(!confirm("⚠️ 本当にこのデータを削除しますか？\n（ゴミデータとしてFirestoreから完全に破棄され、復元できません）")) return;
        
        try {
            const res = await fetch('https://nazokake-backend-862686676938.asia-northeast1.run.app`https://nazokake-backend-862686676938.asia-northeast1.run.app/api/admin/delete', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ doc_id: docId })
            });
            if(res.ok) loadAdminFeed(); // 成功したらリストを再読み込み
            else alert('エラーが発生しました。');
        } catch(e) { alert('通信エラーです。'); }
    }
</script>

</body>
</html>
