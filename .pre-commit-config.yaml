exclude: >
  (?x)^(
    \.venv.*|
    node_modules/|
    tools/audit_reports/|
    _tmp.*|
    \.git/|
    archive/
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-ast
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--no-fix"]
  - repo: local
    hooks:
      - id: check-instructions-layout
        name: check-instructions-layout
        description: tools/instructions/配下のtools/instructions/tools/...ネスト再発を検知する(instructions/194)
        entry: uv run python tools/check_instructions_layout.py
        language: system
        pass_filenames: false
        always_run: true
