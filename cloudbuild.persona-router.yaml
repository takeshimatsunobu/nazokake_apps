# cloudbuild.persona-router.yaml
# ================================
# apps/persona_main_function 用の手動デプロイビルド定義。cloudbuild.yaml(apps/evaluator用)と
# 全く同じ構造・同じ理由で分離ファイルにしている。
#
# 【なぜ `gcloud run deploy --source apps/persona_main_function` を使わないか】
# 素の `gcloud run deploy --source <dir>` は <dir> をそのままビルドコンテキストに
# するため、apps/persona_main_function/Dockerfile が要求する「リポジトリルートを
# ビルドコンテキストとした packages/shared_core への相対パス参照」を解決できず
# ビルド失敗する(apps/evaluator側でcloudbuild.yamlを導入する原因になった障害と
# 同一パターン。apps/evaluator/Dockerfileのヘッダーコメント参照)。
#
# 使い方(ビルド+Artifact Registryへのpushのみ。Cloud Runへの反映は含まない):
#   gcloud builds submit --config cloudbuild.persona-router.yaml \
#     --substitutions=_TAG=manual-$(date +%Y%m%d-%H%M%S)
#
# ビルドしたイメージを実際にCloud Runへ反映する手順は、ビルドとデプロイを1つの
# 設定ファイルへ暗黙的に混ぜず、人間が明示的に確認してから実行できるよう、
# 意図的に別コマンドに分離している(下記「デプロイ手順」を参照)。

substitutions:
  _TAG: "manual-latest"

steps:
  - name: gcr.io/cloud-builders/docker
    # apps/evaluator用cloudbuild.yamlと同一の理由(Dockerfile冒頭の
    # `COPY --from=builder ...` はBuildKit専用構文であり、クラシックビルダーでは
    # 解釈できない)でBuildKitを明示的に有効化する。
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - build
      - -f
      - apps/persona_main_function/Dockerfile
      - -t
      - asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-persona-router:${_TAG}
      - .

images:
  - asia-northeast1-docker.pkg.dev/nazokakeapp-137e5/nazo-agent/nazokake-persona-router:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
