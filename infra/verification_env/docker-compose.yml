# infra/verification_env/docker-compose.yml
# ============================================
# 検証サーバー移行パッケージの決定論的なデプロイ定義(instructions/147)。
#
# 【背景】これまでREADME.mdは「本リポジトリをクローンして既存モジュールをそのまま
# 実行する」という運用手順を文章で説明するに留まっており、実行環境(Pythonバージョン・
# 依存関係・マウント構成)そのものはコード化されていなかった。このファイルは、
# 経験再生アーキテクチャ(tools/ai_knowledge_base.jsonのビルド)とNazo-Agentベンチマークが
# 依存するDockerサンドボックスイメージのビルドという、暗黙の前提だった2つの前処理を、
# 明示的なコマンド・マウント設計として固定する。
#
# 使い方(検証サーバー上、リポジトリルートで):
#   docker compose -f infra/verification_env/docker-compose.yml run --rm knowledge-base-builder
#   docker compose -f infra/verification_env/docker-compose.yml build benchmark-sandbox
#
# 【アーキテクチャ上の注記】tools/benchmark/run_benchmark.py自体はホスト側(検証サーバーの
# ベアメタル/venv)で動作し、AST適用・Pytest実行のみを`docker run`でサンドボックスへ
# 委譲する設計(Docker-in-Docker/ソケットマウントを要求しない、既存のセキュリティ境界を
# 維持する設計)である。したがってrun_benchmark.py自体はこのcompose内のサービスとして
# 定義しない(ホスト側でuv run python tools/benchmark/run_benchmark.pyを直接実行する、
# infra/verification_env/setup_verification_env.sh参照)。

services:
  # Nazo-Agentベンチマークのサンドボックス実行環境。イメージ名は
  # tools/benchmark/run_benchmark.py:DOCKER_IMAGE = "nazo-benchmark-sandbox" と
  # 完全に一致させる必要がある(run_benchmark.pyがこの名前でdocker runを直接起動するため)。
  benchmark-sandbox:
    build:
      context: ../..
      dockerfile: tools/benchmark/Dockerfile
    image: nazo-benchmark-sandbox
    # このサービス自体は常駐プロセスを持たない(ビルド専用)。`docker compose up`ではなく
    # `docker compose build benchmark-sandbox`で明示的にビルドする運用とし、誤ってupで
    # 起動しても即座にargparseエラーで終了するだけで害はないが、意図を明確にするため
    # profilesで通常のup対象からは除外する。
    profiles: ["build-only"]

  # 経験再生アーキテクチャ(tools/knowledge_retriever.py)が読み込む
  # tools/ai_knowledge_base.json を決定論的にビルドするワンショットサービス。
  # ホストのuv/Python環境の有無・バージョン差異に依存せず、常に同一のPythonイメージで
  # 再生成できるようにする(tools/compile_knowledge.pyは標準ライブラリのみに依存するため
  # 追加のpip installは不要)。
  knowledge-base-builder:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "tools/compile_knowledge.py"]

  # 【instructions/160】MLOps自動起動トリガー(tools/mlops_trigger.py)のサイドカー化。
  # ホストOSのcron等(このサーバー固有の暗黙の前提としてIaC化されない設定)への依存を
  # 排除し、定期実行ロジック自体をこのdocker-compose.ymlの一部として明示的にコード化する。
  #
  # ホストの.venvをそのままマウントして直接実行する設計(コンテナ内で改めて
  # pip install/uv syncを行わない)のため、`docker compose up -d mlops-scheduler`前に
  # ホスト側で `uv sync` 済みであることが前提。
  mlops-scheduler:
    image: python:3.11-slim
    working_dir: /workspace
    # 【ホストのソースコード+.venvのマウント】リポジトリルート全体を1つのバインド
    # マウントとしてマウントする。.venv自体もリポジトリルート直下(uv syncの既定配置)
    # にあるため、これ1本で「ソースコード」と「.venv」の両方の要件を満たす
    # (二重にマウントすると同一パスへの重複マウントで意味を持たないため、あえて分けない)。
    volumes:
      - ../..:/workspace
      # 【Rootless Dockerソケットのマウント】tools/mlops_trigger.py起動先のMLOpsパイプ
      # ライン(tools/mlops_pipeline_agent.py等)が定量評価ゲートとしてサブプロセスで
      # tools/benchmark/run_benchmark.pyを実行し、そこから`docker run`でベンチマーク
      # サンドボックスを起動する(Docker-outside-of-Docker)。infra/verification_env/
      # setup_verification_env.shが前提とするRootless dockerdのソケットは
      # ${XDG_RUNTIME_DIR}/docker.sock に存在するため、これをコンテナ内の規定パス
      # (/var/run/docker.sock、dockerクライアントの既定探索先)へマウントする。
      - "${XDG_RUNTIME_DIR:-/run/user/1000}/docker.sock:/var/run/docker.sock"
    environment:
      # マウント先が既定パスと一致していても、明示することで挙動を自己文書化する。
      - DOCKER_HOST=unix:///var/run/docker.sock
    # 【NVIDIA GPUパススルー】ML学習・評価(tools/mlops_pipeline_nazo.py/agent.py)が
    # GPUを利用できるようにする。setup_verification_env.shが前提とする
    # 「--gpus device=0 によるGPU単一専有」(VRAM 8GB制約下での決定論的な排他制御)と
    # 同じ意味論を、Compose Specificationのdeploy.resources.reservations.devicesで表現する。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    # 【ホストネットワークの共有】このサイドカーが呼び出すMLOpsパイプラインの評価ゲート
    # (tools/benchmark/run_benchmark.py経由のNazo-Agent推論)は、ホスト上のOllama
    # (既定 http://127.0.0.1:11434、tools/config.py)へ接続する必要がある。通常のブリッジ
    # ネットワークではコンテナから見た127.0.0.1がホストを指さないため、ホストと同じ
    # ネットワーク名前空間を共有する(Rootless dockerdでも`--network host`は利用可能)。
    network_mode: "host"
    restart: unless-stopped
    # 【Step 1: 定期実行ロジック】ホストOSのcron等に依存せず、シェルスクリプトの無限
    # ループでtools/mlops_trigger.pyを1時間ごとに実行する。python:3.11-slimにはdocker
    # CLI自体が入っていないため、起動時に一度だけ導入してから無限ループへ入る
    # (ループ本体はホストのuv/Python環境を再現するのではなく、マウント済みの
    # ホスト.venvのpythonバイナリを直接呼び出す)。
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        apt-get update && apt-get install -y --no-install-recommends docker.io \
          && rm -rf /var/lib/apt/lists/*
        while true; do
          echo "[mlops-scheduler] $(date -Is) tools/mlops_trigger.py を実行します..."
          /workspace/.venv/bin/python tools/mlops_trigger.py \
            || echo "[mlops-scheduler] $(date -Is) tools/mlops_trigger.py が異常終了しました(次回サイクルで再試行します)"
          echo "[mlops-scheduler] $(date -Is) 次回実行まで1時間sleepします..."
          sleep 3600
        done
