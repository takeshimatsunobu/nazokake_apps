# infra/verification_env/docker-compose.yml
# ============================================
# 検証サーバー移行パッケージの決定論的なデプロイ定義(instructions/147)。
#
# 【背景】これまでREADME.mdは「本リポジトリをクローンして既存モジュールをそのまま
# 実行する」という運用手順を文章で説明するに留まっており、実行環境(Pythonバージョン・
# 依存関係・マウント構成)そのものはコード化されていなかった。このファイルは、
# 経験再生アーキテクチャ(tools/ai_knowledge_base.jsonのビルド)とNazo-Agentベンチマークが
# 依存するDockerサンドボックスイメージのビルドという、暗黙の前提だった2つの前処理を、
# 明示的なコマンド・マウント設計として固定する。
#
# 使い方(検証サーバー上、リポジトリルートで):
#   docker compose -f infra/verification_env/docker-compose.yml run --rm knowledge-base-builder
#   docker compose -f infra/verification_env/docker-compose.yml build benchmark-sandbox
#
# 【アーキテクチャ上の注記】tools/benchmark/run_benchmark.py自体はホスト側(検証サーバーの
# ベアメタル/venv)で動作し、AST適用・Pytest実行のみを`docker run`でサンドボックスへ
# 委譲する設計(Docker-in-Docker/ソケットマウントを要求しない、既存のセキュリティ境界を
# 維持する設計)である。したがってrun_benchmark.py自体はこのcompose内のサービスとして
# 定義しない(ホスト側でuv run python tools/benchmark/run_benchmark.pyを直接実行する、
# infra/verification_env/setup_verification_env.sh参照)。

services:
  # Nazo-Agentベンチマークのサンドボックス実行環境。イメージ名は
  # tools/benchmark/run_benchmark.py:DOCKER_IMAGE = "nazo-benchmark-sandbox" と
  # 完全に一致させる必要がある(run_benchmark.pyがこの名前でdocker runを直接起動するため)。
  benchmark-sandbox:
    build:
      context: ../..
      dockerfile: tools/benchmark/Dockerfile
    image: nazo-benchmark-sandbox
    # このサービス自体は常駐プロセスを持たない(ビルド専用)。`docker compose up`ではなく
    # `docker compose build benchmark-sandbox`で明示的にビルドする運用とし、誤ってupで
    # 起動しても即座にargparseエラーで終了するだけで害はないが、意図を明確にするため
    # profilesで通常のup対象からは除外する。
    profiles: ["build-only"]

  # 経験再生アーキテクチャ(tools/knowledge_retriever.py)が読み込む
  # tools/ai_knowledge_base.json を決定論的にビルドするワンショットサービス。
  # ホストのuv/Python環境の有無・バージョン差異に依存せず、常に同一のPythonイメージで
  # 再生成できるようにする(tools/compile_knowledge.pyは標準ライブラリのみに依存するため
  # 追加のpip installは不要)。
  knowledge-base-builder:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: ["python", "tools/compile_knowledge.py"]

  # 【instructions/162】MLOps自動起動トリガー(tools/mlops_trigger.py)のサイドカー化
  # (完全コンテナネイティブ設計への全面是正版。instructions/160/161の設計はSRE監査で
  # Rejectされ、以下を修正した)。
  mlops-scheduler:
    build:
      context: ../..
      dockerfile: infra/verification_env/mlops_scheduler.Dockerfile
    image: nazo-mlops-scheduler
    # 【Step 1: .venvマウントの廃止】ホストの.venv/ソースコードのバインドマウントは
    # 完全に撤回した。依存関係・アプリケーションコードは
    # infra/verification_env/mlops_scheduler.Dockerfileがビルド時に
    # requirements_orchestrator.txt/packages/shared_coreから決定論的に .venv へ
    # インストール・COPYする(イミュータブルなイメージ)。
    #
    # 【Step 2: 最小特権の局所マウント(パラレルワールドの回避)】プロジェクトルート
    # 全体のマウントは行わない。永続層(SQLite DB)と揮発層(VRAMロック)は関心の分離
    # のため意図的に別々のディレクトリ・別々のボリュームとして局所マウントする
    # (同一ディレクトリに混在させると、片方の局所マウント範囲がもう片方の
    # ライフサイクル・所有権と衝突し、デッドロックの温床になるため却下)。
    volumes:
      # 【永続層】SQLite(WALモード)はコミット時に-wal/-shmサイドカーファイルを
      # 本体と同一ディレクトリへ作成するため、単一ファイルではなく
      # 「DBファイルが存在するディレクトリそのもの」を rw でマウントする
      # (単一ファイルのみのマウントでは、サイドカーファイルがコンテナの
      # 使い捨てレイヤー側にしか作られずホストへ永続化されない)。過去に発生した
      # 「no such table」エラー(パスのズレによる空DBの新規作成)を、下のenvironment
      # でのNAZOKAKE_DB_PATH明示的上書きと組み合わせて再発防止する。
      - ../../data:/workspace/data
      # 【揮発層】VRAM_LOCK_PATH(ランタイムのみ存在するファイルロック本体)は、
      # 永続データベースとは独立した別ボリュームとして隔離する。
      - ../../run:/workspace/run
      # 【Rootless Dockerソケットのマウント】tools/mlops_trigger.py起動先のMLOpsパイプ
      # ライン(tools/mlops_pipeline_agent.py等)が定量評価ゲートとしてサブプロセスで
      # tools/benchmark/run_benchmark.pyを実行し、そこから`docker run`でベンチマーク
      # サンドボックスを起動する(Docker-outside-of-Docker)。infra/verification_env/
      # setup_verification_env.shが前提とするRootless dockerdのソケットは
      # ${XDG_RUNTIME_DIR}/docker.sock に存在するため、これをコンテナ内の規定パス
      # (/var/run/docker.sock、dockerクライアントの既定探索先)へマウントする。
      - "${XDG_RUNTIME_DIR:-/run/user/1000}/docker.sock:/var/run/docker.sock"
    environment:
      # マウント先が既定パスと一致していても、明示することで挙動を自己文書化する。
      - DOCKER_HOST=unix:///var/run/docker.sock
      # 【Step 3: パスの明示的な上書き】上のvolumesで局所マウントしたコンテナ内の
      # 絶対パスへ明示的に上書きする。tools/config.pyの既定値(または.envの値)への
      # 暗黙の依存を断ち切り、「パスがズレて存在しないファイルをsqlite3が黎明に
      # 新規作成してしまい、テーブルが無い('no such table')」事故を構造的に防ぐ。
      - NAZOKAKE_DB_PATH=/workspace/data/nazokake_local.db
      - VRAM_LOCK_PATH=/workspace/run/.vram.lock
      # 【Step 4に伴う修正】network_mode: hostの撤回により、コンテナ内の127.0.0.1は
      # もはやホストを指さない(コンテナ自身を指す)。tools/config.pyの既定値
      # (http://127.0.0.1:11434)を、下のextra_hostsで定義するゲートウェイ経由の
      # ホスト名へ明示的に上書きする。
      - OLLAMA_HOST=http://host.docker.internal:11434
    # env_file: 秘密情報(.env、ANTHROPIC_API_KEY等)はイメージへCOPYせず、bindマウント
    # もしない(イメージレイヤーやマウント経由でホストのファイルシステムパスとして
    # 露出させない)。docker composeのenv_file機能はホスト側でファイルを読み、値のみを
    # プロセスのメモリ上の環境変数としてコンテナへ注入する(ファイル自体はコンテナの
    # ファイルシステムには一切現れない)。
    env_file:
      - ../../.env
    # 【Step 2: ネットワーク隔離の復元】network_mode: "host"(コンテナのネットワーク
    # 名前空間をホストと完全に共有する特権エスケープ)を撤回し、既定のブリッジ
    # ネットワークのまま、ホストOSへのアクセスだけを最低限のゲートウェイ経由に限定する。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 【NVIDIA GPUパススルー】ML学習・評価(tools/mlops_pipeline_nazo.py/agent.py)が
    # GPUを利用できるようにする。setup_verification_env.shが前提とする
    # 「--gpus device=0 によるGPU単一専有」(VRAM 8GB制約下での決定論的な排他制御)と
    # 同じ意味論を、Compose Specificationのdeploy.resources.reservations.devicesで表現する。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    restart: unless-stopped
    healthcheck:
      # 【instructions/298: プロセスハングアップ検知】python:3.11-slimベースイメージには
      # procps(pgrep/ps)が含まれないため、追加パッケージを導入せず/procを直接スキャンして
      # tools/scheduler_daemon.py(ENTRYPOINT、PID1)のcmdlineを確認する。このデーモンは
      # 実際のMLOpsパイプラインをsubprocess.run()でブロッキング実行する間(数十分〜
      # 数時間)もPID1プロセス自体は生存し続ける(単にシステムコール待ちで停止している
      # だけでハングではない)ため、この生存確認は長時間の正当なパイプライン実行中でも
      # false unhealthy(誤検知による不要な再起動)を起こさない。
      test:
        - CMD-SHELL
        - |
          python3 -c '
          import os, sys
          found = False
          for pid in os.listdir("/proc"):
              if not pid.isdigit():
                  continue
              try:
                  with open("/proc/" + pid + "/cmdline", "rb") as f:
                      if b"scheduler_daemon.py" in f.read():
                          found = True
                          break
              except OSError:
                  continue
          sys.exit(0 if found else 1)
          '
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # 【Step 3: PID 1問題の解消】commandは指定しない。ENTRYPOINTは
    # mlops_scheduler.Dockerfileが定義するtools/scheduler_daemon.py(signalモジュールで
    # SIGTERM/SIGINTを直接トラップするPythonデーモン)。bashの無限sleepループ
    # (シグナルを子プロセスへ伝播できずコンテナがゾンビ化する)は完全に廃止した。
    # 【instructions/169: GCP Cloud Loggingへのインフラログ統合】
    # コンテナのクラッシュログ等、アプリ層(daemon_heartbeat.json)に上がらない
    # システムログを、SSH接続無しにGCP Log Explorer(ブラウザ)で監視できるようにする。
    # Docker純正のgcplogsログドライバーはコンテナのstdout/stderrを直接Cloud Logging
    # APIへ送るため、追加のエージェント導入(Ops Agent等)を要さない
    # ("No-Toil"の原則に最も合致する最小コスト案)。VM(nazokake-l4-vm)にアタッチされた
    # サービスアカウントが、hunter_gcp_instance.ps1が要求するのと同じ
    # `cloud-platform`スコープ(roles/logging.logWriter相当を含む)を持っている前提。
    # 【未検証事項】Rootless Dockerとgcplogsドライバーの組み合わせはこの開発環境
    # (Docker未導入)では実機検証できない。初回デプロイ時に1行echoしてから
    # 1分以内にGCP Log Explorerへ到達するかのスモークテストが必要(不整合が見つかった
    # 場合は、Rootless Docker配下のJSON-fileログ(~/.local/share/docker/containers/
    # */*-json.log。rootful既定の/var/lib/docker/...ではない点に注意)をGoogle
    # Cloud Ops Agent/Fluent Bitで直接テイルする方式へフォールバックする)。
    # 【SRE差し戻し対応: ノンブロッキング化(必須)】ロギングドライバーの既定
    # (blocking)モードでは、GCP Logging APIの一時的な高レイテンシ/障害時に、
    # ログドライバーへの書き込み自体がブロックし、コンテナ本体(このデーモンの
    # print()呼び出し)まで連鎖的にフリーズしうる。mode: non-blockingにより、
    # ログはまずインメモリのリングバッファ(max-buffer-size)へ書き込まれ、
    # ドライバー側の送信が遅延・失敗してもアプリケーション本体はブロックされない
    # (バッファが溢れた場合は古いログから破棄されるが、フリーズよりはるかに安全)。
    logging:
      driver: gcplogs
      options:
        gcp-project: "nazokakeapp-137e5"
        labels: "com.docker.compose.service"
        mode: "non-blocking"
        max-buffer-size: "4m"
