[mypy]

# firebase_admin / nazokake_core: no type stubs available (or mypy fails to
# resolve the editable install). Both import and run correctly at runtime,
# so they are excluded from type checking rather than left as noisy errors.
[mypy-firebase_admin.*]
ignore_missing_imports = True

[mypy-nazokake_core.*]
ignore_missing_imports = True
