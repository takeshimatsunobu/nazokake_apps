[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nazokake-core"
version = "0.1.0"
description = "Nazokake Apps Shared Core Domain"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nazokake_core*"]
